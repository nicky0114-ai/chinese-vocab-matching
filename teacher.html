    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
    }

    .nav-tabs {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .main-container {
      flex: 1;
      padding: 28px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .master-broadcast-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #6366f1;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
    }

    .master-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .connected-groups-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      width: 100%;
    }

    .presence-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      background: #334155;
      color: #94a3b8;
    }

    .presence-badge.online {
      background: #059669 !important;
      color: #fff !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .groups-review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
    }

    .group-review-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .group-review-card.is-empty {
      border-style: dashed;
      border-color: #475569;
      background: #0f172a;
    }

    .group-review-card.is-perfect {
      border-color: #10b981;
      background: #064e3b;
    }

    .group-review-card.has-errors {
      border-color: #ef4444;
      background: #450a0a;
    }

    .group-review-title {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .group-review-pair-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-review-pair-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 4px solid #64748b;
    }

    .group-review-pair-item.correct {
      border-left-color: #10b981;
    }

    .group-review-pair-item.wrong {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .settings-section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .settings-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .form-select, .form-textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
    }

    .form-textarea {
      height: 220px;
      line-height: 1.6;
      resize: vertical;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-secondary {
      background: #334155;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;

</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🎓</span>
      <div>
        <h1 class="brand-title">生字語詞限時闖關 - 教師主控與檢討大螢幕</h1>
      </div>
    </div>

    <nav class="nav-tabs">
      <button class="nav-btn active" id="tab-btn-review" onclick="switchView('review')">
        📊 全班作答對比與檢討
      </button>
      <button class="nav-btn" id="tab-btn-settings" onclick="switchView('settings')">
        ⚙️ 組別與下一課生字設定
      </button>
    </nav>
  </header>

  <main class="main-container">
    
    <!-- MASTER BROADCAST CONTROL CARD -->
    <div class="master-broadcast-card">
      <div class="master-control-row">
        <div>
          <h3 style="font-size: 20px; font-weight: 900; color: #a5b4fc;">🎮 全班課堂廣播主控台</h3>
          <p style="color: #c7d2fe; font-size: 14px; margin-top: 4px;">先請各組進入房間，由老師統一按「開始作答」，全班平板同步解鎖倒數！</p>
        </div>

        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <button class="btn-start" onclick="broadcastStartRound()">
            ▶️ 1. 發布並統一開始作答！
          </button>
          <button class="btn-danger" onclick="broadcastEndRound()">
            ⏹️ 2. 強制結束作答（鎖定平板）
          </button>
          <button class="btn-secondary" onclick="broadcastResetRound()">
            🔄 3. 重置本字（準備下一輪）
          </button>
        </div>
      </div>

      <div class="master-control-row" style="border-top: 1px solid rgba(99, 102, 241, 0.3); padding-top: 16px;">
        <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
          <span style="font-weight: 800; color: #a5b4fc;">📚 選擇教學/複習課次：</span>
          <select id="master-lesson-select" onchange="switchActiveLesson(this.value)" style="background: #1e1b4b; color: #fff; border: 2px solid #6366f1; padding: 8px 16px; border-radius: 10px; font-size: 16px; font-weight: 800;">
            <!-- Dynamic lesson options -->
          </select>

          <span style="font-weight: 700; color: var(--accent);">挑戰生字：</span>
          <select id="review-char-select" onchange="changeReviewCharacter(this.value)" style="background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-size: 16px; font-weight: 700;">
            <!-- Dynamic options -->
          </select>

          <span style="font-weight: 700; color: var(--accent); margin-left: 12px;">限定時間：</span>
          <select id="master-timer-select" style="background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-size: 16px; font-weight: 700;">
            <option value="30">30 秒 (極速)</option>
            <option value="60" selected>60 秒 (標準)</option>
            <option value="90">90 秒 (充裕)</option>
            <option value="120">120 秒 (輕鬆)</option>
          </select>
        </div>

        <!-- Live Connected Presence Bar -->
        <div class="connected-groups-bar" id="presence-bar-container">
          <span style="font-size: 13px; color: #c7d2fe; font-weight: 700;">各組連線狀態：</span>
          <!-- Dynamic presence badges -->
        </div>
      </div>
    </div>

    <!-- VIEW 1: SYNCHRONIZED REVIEW DASHBOARD VIEW -->
    <section id="view-review" class="view-panel active">
      <div style="background: var(--card-bg); padding: 20px 24px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <div>
          <h2 style="font-size: 22px; font-weight: 800;" id="review-title-display">【裁】字全班各組作答對比與檢討</h2>
          <p style="color: var(--text-muted); margin-top: 4px;">大螢幕同步對比各組連線細節！學生在手機/平板作答時此處會自動即時更新。</p>
        </div>
        <div style="font-size: 24px; font-weight: 900; color: #f59e0b; background: #0f172a; padding: 8px 20px; border-radius: 12px; border: 1px solid var(--border);" id="master-timer-clock">
          ⏱️ 倒數 01:00
        </div>
      </div>

      <div class="misconception-banner" style="background: linear-gradient(135deg, #7c2d12, #991b1b); border: 1px solid #f87171; border-radius: 16px; padding: 16px 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px;" id="misconception-banner">
        <span style="font-size: 32px;">🔍</span>
        <div>
          <h4 style="font-size: 18px; font-weight: 800; color: #fecaca;" id="misconception-title">全班迷思詞語分析：</h4>
          <p style="font-size: 15px; color: #fee2e2; margin-top: 4px;" id="misconception-desc">等待全班小組作答中...</p>
        </div>
      </div>

      <div class="groups-review-grid" id="groups-review-grid-container">
        <!-- Dynamic Real Group Result Cards -->
      </div>
    </section>

    <!-- VIEW 2: SETTINGS & NEXT LESSON IMPORT VIEW -->
    <section id="view-settings" class="view-panel">
      
      <div class="settings-section-card">
        <h3 class="settings-title">👥 1. 班級小組數量設定</h3>
        <div class="form-group">
          <label class="form-label">請選擇您班級的小組數量：</label>
          <select class="form-select" id="group-count-select" onchange="updateGroupCountSetting(this.value)">
            <option value="4">4 組</option>
            <option value="5">5 組</option>
            <option value="6">6 組</option>
            <option value="7" selected>7 組 (標準班級)</option>
            <option value="8">8 組</option>
            <option value="10">10 組</option>
          </select>
        </div>
      </div>

      <div class="settings-section-card">
        <h3 class="settings-title">📝 2. 快速貼入下一課生字與釋義</h3>
        <p style="color: var(--text-muted); margin-bottom: 16px;">格式說明：每一字開頭為【生字】，換行後貼上「語詞：釋義」</p>
        
        <div class="form-group">
          <label class="form-label">課程名稱/課次：</label>
          <input type="text" id="lesson-name-input" class="form-select" placeholder="例如：第五課 題西林壁與遊山西村">
        </div>

        <div class="form-group">
          <label class="form-label">生字與語詞釋義文本：</label>
          <textarea id="custom-vocab-input" class="form-textarea" placeholder="【緣】
緣分：人與人之間建立良好關係的偶然機會。
緣由：原由、原因。

【蓬】
蓬勃：繁榮、旺盛的樣子。
蓬鬆：形容頭髮或毛髮鬆散柔軟。"></textarea>
        </div>

        <div style="display: flex; gap: 12px;">
          <button class="btn-start" onclick="applyCustomLesson()">
            💾 儲存並發布此課生字
          </button>
          <button class="btn-secondary" onclick="loadDefaultLesson1()">
            🔄 恢復為預設第一課
          </button>
          <button class="btn-danger" onclick="clearAllSyncData()">
            🗑️ 清空全班歷史作答紀錄
          </button>
        </div>
      </div>

    </section>

  </main>

                    { "word": "蔓藤", "def": "植物細長且攀附他物的莖。" },
                    { "word": "葛藤", "def": "一種蔓生植物，在文學中常比喻事情糾纏不清或人際關係複雜。" },
                    { "word": "順藤摸瓜(成語)", "def": "沿著藤蔓去尋找西瓜。比喻沿著線索追根究底，查明事實真相。" }
                ]
            },
            {
                "char": "蔓",
                "items": [
                    { "word": "蔓延", "def": "像蔓草般向四周延展滋生，比喻事物擴散開來。" },
                    { "word": "蔓生", "def": "藤蔓植物攀附他物成長的特性。" },
                    { "word": "枝蔓", "def": "比喻文章或說話中多餘且糾纏不清的分支細節。" },
                    { "word": "蔓草", "def": "蔓延滋生的草，常比喻繁雜或荒蕪的景象。" },
                    { "word": "蔓藤", "def": "細長而能纏繞他物的植物莖。" },
                    { "word": "蔓草荒煙(成語)", "def": "形容荒涼冷落的景象。" }
                ]
            }
        ]
    }
];

    let lessonBank = [];
    let currentLessonData = defaultLessonBank[0].data;
    let currentLessonId = defaultLessonBank[0].id;
    let currentCharIndex = 0;
    let totalGroupCount = 7;
    let masterTimerInterval = null;

    let mqttClient = null;
    let bcChannel = null;
    let activePresence = {};

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();
      populateReviewSelect();
      initTeacherSyncEngine();
      renderPresenceBar();
      renderSyncReviewGrid(0);
    });

    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      const targetView = document.getElementById(`view-${viewName}`);
      const targetBtn = document.getElementById(`tab-btn-${viewName}`);

      if (targetView) targetView.classList.add('active');
      if (targetBtn) targetBtn.classList.add('active');
    }

    function updateGroupCountSetting(val) {
      totalGroupCount = parseInt(val) || 7;
      localStorage.setItem('custom_group_count', totalGroupCount);
      renderPresenceBar();
      renderSyncReviewGrid(currentCharIndex);
    }

    function loadSavedSettings() {
      const savedGroups = localStorage.getItem('custom_group_count');
      if (savedGroups) {
        totalGroupCount = parseInt(savedGroups) || 7;
        const sel = document.getElementById('group-count-select');
        if (sel) sel.value = totalGroupCount;
      }
      loadLessonBank();
    }

    function loadLessonBank() {
      lessonBank = [...defaultLessonBank];

      const savedActiveId = localStorage.getItem('active_lesson_id');
      if (savedActiveId && lessonBank.some(l => l.id === savedActiveId)) {
        currentLessonId = savedActiveId;
      } else {
        currentLessonId = lessonBank[0].id;
      }

      const activeLesson = lessonBank.find(l => l.id === currentLessonId) || lessonBank[0];
      currentLessonId = activeLesson.id;
      currentLessonData = activeLesson.data || [];

      renderLessonSelectOptions();
      populateReviewSelect();
    }

    function renderLessonSelectOptions() {
      const masterSel = document.getElementById('master-lesson-select');
      if (!masterSel) return;

      masterSel.innerHTML = lessonBank.map(l => `
        <option value="${l.id}" ${l.id === currentLessonId ? 'selected' : ''}>
          📚 ${l.title} (${l.data.length} 個生字)
        </option>
      `).join('');
    }

    function switchActiveLesson(lessonId) {
      const lesson = lessonBank.find(l => l.id === lessonId);
      if (!lesson) return;

      currentLessonId = lesson.id;
      currentLessonData = lesson.data;
      currentCharIndex = 0;
      localStorage.setItem('active_lesson_id', currentLessonId);

      renderLessonSelectOptions();
      populateReviewSelect();
      renderSyncReviewGrid(0);

      broadcastLessonChange(lesson);
      broadcastResetRound();
    }

    function broadcastLessonChange(lesson) {
      const payloadData = {
        lessonId: lesson.id,
        lessonTitle: lesson.title,
        lessonData: lesson.data,
        updatedAt: Date.now()
      };

      const payload = { type: 'lesson_change', data: payloadData };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('chinese_vocab_room601/lesson', JSON.stringify(payload));
      }
      if (bcChannel) {
        bcChannel.postMessage(payload);
      }
      if (db) {
        try {
          db.ref('vocab_rooms/room601/current_lesson').set(payloadData);
        } catch(e) {}
      }
    }

    function populateReviewSelect() {
      const sel = document.getElementById('review-char-select');
      if (!sel) return;
      sel.innerHTML = currentLessonData.map((d, idx) => `<option value="${idx}">【${d.char}】字生字配對</option>`).join('');
    }

    function changeReviewCharacter(cIdx) {
      currentCharIndex = parseInt(cIdx);
      listenToCloudUpdates(currentCharIndex);
      renderSyncReviewGrid(currentCharIndex);
      broadcastCharacterChange(currentCharIndex);
    }

    function broadcastCharacterChange(cIdx) {
      const payloadData = {
        targetCharIndex: cIdx,
        lessonId: currentLessonId,
        updatedAt: Date.now()
      };
      const payload = { type: 'character_change', data: payloadData };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('chinese_vocab_room601/character', JSON.stringify(payload));
      }
      if (bcChannel) {
        bcChannel.postMessage(payload);
      }
      if (db) {
        try {
          db.ref('vocab_rooms/room601/current_character').set(payloadData);
        } catch(e) {}
      }
    }

    function initTeacherSyncEngine() {
      // 1. BroadcastChannel for local tab sync
      try {
        bcChannel = new BroadcastChannel('chinese_vocab_room601');
        bcChannel.onmessage = (event) => {
          handleIncomingTeacherSync(event.data);
        };
      } catch(e) {}

      // 2. LocalStorage storage listener
      window.addEventListener('storage', (e) => {
        if (e.key === 'vocab_room601_presence' && e.newValue) {
          try {
            const pMap = JSON.parse(e.newValue);
            for (let gId in pMap) {
              handlePresence(gId);
            }
          } catch(err) {}
        } else if (e.key && e.key.startsWith('vocab_room601_answer_char_') && e.newValue) {
          try {
            const aData = JSON.parse(e.newValue);
            handleIncomingAnswer(aData, aData.charIndex);
          } catch(err) {}
        }
      });

      // 3. MQTT for Cloud Real-time WebSockets Sync
      if (window.mqtt) {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'teacher_' + Math.random().toString(16).substr(2, 8),
            keepalive: 30
          });

          mqttClient.on('connect', () => {
            mqttClient.subscribe('chinese_vocab_room601/#');
          });

          mqttClient.on('message', (topic, message) => {
            try {
              const data = JSON.parse(message.toString());
              handleIncomingTeacherSync(data);
            } catch(e) {}
          });

          mqttClient.on('error', () => {
            try {
              mqttClient = mqtt.connect('wss://broker.hivemq.com:8000/mqtt', { clientId: 'teacher_' + Math.random().toString(16).substr(2, 8) });
            } catch(e) {}
          });
        } catch(e) {}
      }

      // 4. Firebase Listeners
      listenToPresence();
      listenToCloudUpdates(0);

      // Periodically expire offline presence (after 12s)
      setInterval(() => {
        const now = Date.now();
        let changed = false;
        for (let g = 1; g <= totalGroupCount; g++) {
          if (activePresence[g]) {
            if (now - activePresence[g].lastSeen > 12000) {
              delete activePresence[g];
              changed = true;
            }
          }
        }
        if (changed) {
          renderPresenceBar();
          renderSyncReviewGrid(currentCharIndex);
        }
      }, 2000);
    }

    function handlePresence(gId) {
      gId = parseInt(gId);
      if (isNaN(gId) || gId <= 0) return;
      activePresence[gId] = {
        status: 'online',
        lastSeen: Date.now()
      };
      renderPresenceBar();
      renderSyncReviewGrid(currentCharIndex);
    }

    function handleIncomingTeacherSync(msg) {
      if (!msg) return;

      if (msg.type === 'presence') {
        const pData = msg.data || msg;
        const gId = pData.groupId || pData.gId;
        if (gId) {
          handlePresence(gId);
        }
      } else if (msg.type === 'answer') {
        const aData = msg.data;
        if (aData && aData.groupId) {
          handleIncomingAnswer(aData, msg.charIdx);
        }
      }
    }

    function handleIncomingAnswer(aData, charIdx) {
      if (!aData || !aData.groupId) return;
      const gId = parseInt(aData.groupId);
      const cIdx = charIdx !== undefined ? parseInt(charIdx) : (aData.charIndex !== undefined ? parseInt(aData.charIndex) : currentCharIndex);

      const syncKey = `sync_char_${cIdx}`;
      const localMap = JSON.parse(localStorage.getItem(syncKey) || '{}');
      localMap[gId] = aData;
      localStorage.setItem(syncKey, JSON.stringify(localMap));

      if (cIdx === currentCharIndex) {
        renderSyncReviewGrid(cIdx);
      }
    }

    function broadcastMasterControl(state) {
      const timerSecs = parseInt(document.getElementById('master-timer-select').value || '60');
      const startTime = Date.now();

      const payloadData = {
        state: state,
        lessonId: currentLessonId,
        lessonTitle: lessonBank.find(l => l.id === currentLessonId)?.title || '',
        lessonData: currentLessonData,
        targetCharIndex: currentCharIndex,
        timerSeconds: timerSecs,
        startTime: startTime,
        updatedAt: startTime
      };

      const payload = { type: 'control', data: payloadData };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('chinese_vocab_room601/control', JSON.stringify(payload));
      }
      if (bcChannel) {
        bcChannel.postMessage(payload);
      }
      if (db) {
        try {
          db.ref('vocab_rooms/room601/control').set(payloadData);
        } catch(e) {}
      }

      try {
        localStorage.setItem('vocab_room601_control', JSON.stringify(payloadData));
      } catch(e) {}

      if (state === 'active') {
        startMasterClock(startTime, timerSecs);
      } else if (state === 'ended') {
        if (masterTimerInterval) clearInterval(masterTimerInterval);
        document.getElementById('master-timer-clock').textContent = '⏰ 作答結束！';
      } else if (state === 'waiting') {
        if (masterTimerInterval) clearInterval(masterTimerInterval);
        document.getElementById('master-timer-clock').textContent = '⏱️ 等待發布作答';
        resetCurrentCharAllGroups();
      }
    }

    function broadcastStartRound() {
      broadcastMasterControl('active');
    }

    function broadcastEndRound() {
      broadcastMasterControl('ended');
    }

    function broadcastResetRound() {
      broadcastMasterControl('waiting');
    }

    function startMasterClock(startTime, totalSecs) {
      if (masterTimerInterval) clearInterval(masterTimerInterval);

      const updateClock = () => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const rem = Math.max(0, totalSecs - elapsed);

        const mins = Math.floor(rem / 60);
        const secs = rem % 60;
        document.getElementById('master-timer-clock').textContent = `⏱️ 倒數 ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (rem === 0) {
          clearInterval(masterTimerInterval);
          broadcastEndRound();
        }
      };

      updateClock();
      masterTimerInterval = setInterval(updateClock, 1000);
    }

    function listenToPresence() {
      if (!db) return;
      try {
        db.ref('vocab_rooms/room601/presence').on('value', (snapshot) => {
          const presenceDataCache = snapshot.val() || {};
          for (let key in presenceDataCache) {
            const gInfo = presenceDataCache[key];
            const gId = gInfo ? (gInfo.groupId || parseInt(key.replace('group_', ''))) : null;
            if (gId) {
              handlePresence(gId);
            }
          }
        });
      } catch(e) {}
    }

    function renderPresenceBar() {
      const container = document.getElementById('presence-bar-container');
      if (!container) return;
      let html = '<span style="font-size: 13px; color: #c7d2fe; font-weight: 700;">各組連線狀態：</span>';
      const now = Date.now();
      for (let g = 1; g <= totalGroupCount; g++) {
        const info = activePresence[g];
        const isOnline = !!(info && (now - info.lastSeen < 15000));
        html += `<span class="presence-badge ${isOnline ? 'online' : ''}" style="margin-left: 6px;">第 ${g} 組 ${isOnline ? '🟢 已連線' : '⚪ 未連線'}</span>`;
      }
      container.innerHTML = html;
    }

    let currentDbRef = null;
    function listenToCloudUpdates(cIdx) {
      if (!db) return;
      if (currentDbRef) currentDbRef.off();

      currentDbRef = db.ref(`vocab_rooms/room601/answers/char_${cIdx}`);
      currentDbRef.on('value', (snapshot) => {
        const cloudMap = snapshot.val() || {};
        const syncKey = `sync_char_${cIdx}`;
        const localMap = JSON.parse(localStorage.getItem(syncKey) || '{}');

        for (let gKey in cloudMap) {
          const item = cloudMap[gKey];
          if (item) {
            const gId = (item.groupId !== undefined) ? parseInt(item.groupId) : parseInt(gKey.replace('group_', ''));
            if (!isNaN(gId)) {
              localMap[gId] = item;
            }
          }
        }

        localStorage.setItem(syncKey, JSON.stringify(localMap));
        renderSyncReviewGrid(cIdx);
      });
    }

    function renderSyncReviewGrid(cIdx) {
      if (cIdx >= currentLessonData.length) cIdx = 0;
      const groupData = currentLessonData[cIdx];
      if (!groupData) return;

      const titleEl = document.getElementById('review-title-display');
      if (titleEl) titleEl.textContent = `【${groupData.char}】字 全班 ${totalGroupCount} 組作答結果對比與檢討`;

      const selEl = document.getElementById('review-char-select');
      if (selEl) selEl.value = cIdx;

      const syncKey = `sync_char_${cIdx}`;
      const syncMap = JSON.parse(localStorage.getItem(syncKey) || '{}');
      const container = document.getElementById('groups-review-grid-container');
      if (!container) return;

      const wordErrorCounts = {};
      groupData.items.forEach(item => wordErrorCounts[item.word] = 0);

      let answeredGroupCount = 0;
      const htmlArray = [];
      const now = Date.now();

      for (let g = 1; g <= totalGroupCount; g++) {
        const gState = syncMap[g];
        const presInfo = activePresence[g];
        const isGroupConnected = !!(presInfo && (now - presInfo.lastSeen < 15000));
        
        if (!gState || !gState.userMatches || Object.keys(gState.userMatches).length === 0) {
          htmlArray.push(`
            <div class="group-review-card ${isGroupConnected ? '' : 'is-empty'}" style="${isGroupConnected ? 'border-color: #6366f1; background: #1e1b4b;' : ''}">
              <div class="group-review-title">
                <span>第 ${g} 組</span>
                <span style="font-size: 13px; font-weight: 700; color: ${isGroupConnected ? '#34d399' : '#64748b'};">
                  ${isGroupConnected ? '🟢 已連線進入房間' : '⚪ 未連線'}
                </span>
              </div>
              <div style="padding: 24px; text-align: center; color: ${isGroupConnected ? '#a5b4fc' : '#64748b'}; font-size: 15px; font-weight: 700;">
                ${isGroupConnected ? '📱 平板已就緒，等待老師發布「開始作答」' : '⏳ 等待小組在平板上點選組別進入...'}
              </div>
            </div>
          `);
          continue;
        }

        answeredGroupCount++;
        const isPerfect = gState.isCorrect;
        const matches = gState.userMatches || {};
        const defs = gState.shuffledDefs || [];

        let correctInGroup = 0;

        const pairRows = groupData.items.map((item, wIdx) => {
          const matchedDIdx = matches[wIdx];
          const hasMatched = matchedDIdx !== undefined;

          let isCorrect = false;
          let chosenDefText = '（未連線）';

          if (hasMatched && defs[matchedDIdx]) {
            const chosenObj = defs[matchedDIdx];
            chosenDefText = chosenObj.def;
            if (chosenObj.originalIdx === wIdx) {
              isCorrect = true;
              correctInGroup++;
            } else {
              wordErrorCounts[item.word]++;
            }
          }

          return `
            <div class="group-review-pair-item ${isCorrect ? 'correct' : (hasMatched ? 'wrong' : '')}">
              <div style="font-weight: 700; color: ${isCorrect ? '#34d399' : '#f87171'};">
                ${isCorrect ? '✓' : '✕'} ${item.word}
              </div>
              <div style="font-size: 12px; color: #cbd5e1;">
                ${isCorrect ? `對應：${item.def}` : `誤選：${chosenDefText}`}
              </div>
            </div>
          `;
        }).join('');

        htmlArray.push(`
          <div class="group-review-card ${isPerfect ? 'is-perfect' : 'has-errors'}">
            <div class="group-review-title">
              <span>第 ${g} 組</span>
              <span style="font-size: 14px; font-weight: 700; color: ${isPerfect ? '#34d399' : 'var(--accent)'};">
                ${isPerfect ? '🟢 100% 全對' : `答對 ${correctInGroup}/${groupData.items.length} 題`}
              </span>
            </div>
            <div class="group-review-pair-list">
              ${pairRows}
            </div>
          </div>
        `);
      }

      container.innerHTML = htmlArray.join('');

      const bannerTitle = document.getElementById('misconception-title');
      const bannerDesc = document.getElementById('misconception-desc');

      if (answeredGroupCount === 0) {
        if (bannerTitle) bannerTitle.textContent = `⏳ 全班【${groupData.char}】字尚未開始作答`;
        if (bannerDesc) bannerDesc.textContent = `請老師請學生在平板點選【${groupData.char}】生字進行配對連線！`;
        return;
      }

      let topErrorWord = '';
      let maxErrors = 0;
      for (let word in wordErrorCounts) {
        if (wordErrorCounts[word] > maxErrors) {
          maxErrors = wordErrorCounts[word];
          topErrorWord = word;
        }
      }

      if (maxErrors > 0) {
        if (bannerTitle) bannerTitle.textContent = `🔥 課堂核心檢討標的：【${topErrorWord}】（全班共 ${maxErrors} 組在此題發生迷思）`;
        if (bannerDesc) bannerDesc.textContent = `請老師引導全班針對【${topErrorWord}】的白話釋義與相近詞進行比較說明！`;
      } else {
        if (bannerTitle) bannerTitle.textContent = `🎉 全班展現超強實力！【${groupData.char}】字全班表現優異！`;
        if (bannerDesc) bannerDesc.textContent = `已作答的 ${answeredGroupCount} 個小組皆精準完成釋義配對，可請小組發表造句進行延伸學習！`;
      }
    }

    function resetCurrentCharAllGroups() {
      const syncKey = `sync_char_${currentCharIndex}`;
      localStorage.removeItem(syncKey);

      if (db) {
        try {
          db.ref(`vocab_rooms/room601/answers/char_${currentCharIndex}`).remove();
        } catch(e) {}
      }

      renderSyncReviewGrid(currentCharIndex);
    }

    function clearAllSyncData() {
      if (confirm("確定要清空全班所有生字的歷史作答紀錄嗎？")) {
        for (let key in localStorage) {
          if (key.startsWith('sync_char_') || key.startsWith('vocab_group_') || key.startsWith('vocab_room601_')) {
            localStorage.removeItem(key);
          }
        }
        if (db) {
          try {
            db.ref(`vocab_rooms/room601`).remove();
          } catch(e) {}
        }
        renderSyncReviewGrid(0);
        alert("已成功清空全班作答紀錄！");
      }
    }

    function applyCustomLesson() {
      const rawText = document.getElementById('custom-vocab-input').value.trim();
      const lessonName = document.getElementById('lesson-name-input').value.trim() || '自訂課次生字配對';

      if (!rawText) {
        alert("請貼入下一課的生字與語詞釋義文字！");
        return;
      }

      const parsedData = [];
      const charBlocks = rawText.split(/【(.*?)】/).filter(Boolean);

      for (let i = 0; i < charBlocks.length; i += 2) {
        const charName = charBlocks[i].trim();
        const contentLines = (charBlocks[i + 1] || '').split('
').map(l => l.trim()).filter(Boolean);

        const items = [];
        contentLines.forEach(line => {
          const parts = line.split(/[:：]/);
          if (parts.length >= 2) {
            items.push({
              word: parts[0].trim(),
              def: parts.slice(1).join('：').trim()
            });
          }
        });

        if (charName && items.length > 0) {
          parsedData.push({
            char: charName,
            items: items
          });
        }
      }

      if (parsedData.length === 0) {
        alert("解析失敗！請確認格式是否為：\n【生字】\n語詞：釋義");
        return;
      }

      currentLessonData = parsedData;
      localStorage.setItem('custom_lesson_data', JSON.stringify(currentLessonData));

      populateReviewSelect();
      switchView('review');
      alert(`🎉 成功匯入《${lessonName}》共 ${parsedData.length} 個生字！學生平板將自動載入全新課次。`);
    }

    function loadDefaultLesson1() {
      currentLessonData = [...defaultLessonBank[0].data];
      localStorage.removeItem('custom_lesson_data');

      populateReviewSelect();
      switchView('review');
      alert("已恢復為預設課次生字！");
    }
  </script>
</body>
