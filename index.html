<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生字語詞小組配對 - 學生平板端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <!-- Firebase CDN for Real-time Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- MQTT Real-time WebSocket Relay -->
  <script src="lib/mqtt.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.2/dist/mqtt.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.5s ease;
    }

    body.is-correct-theme {
      background-color: #064e3b !important;
    }

    /* INITIAL GROUP SELECTION MODAL */
    .entry-group-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .entry-group-modal.hidden {
      display: none !important;
    }

    .entry-title {
      font-size: 36px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
    }

    .entry-subtitle {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 32px;
    }

    .entry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      max-width: 700px;
      width: 100%;
    }

    .entry-group-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: var(--text);
      font-family: inherit;
      width: 100%;
      outline: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .entry-group-card:active {
      transform: scale(0.95);
      background: #4c1d95 !important;
      border-color: #818cf8 !important;
    }

    .entry-group-card:hover {
      border-color: var(--accent);
      transform: scale(1.05);
      background: #2e1065;
    }

    .entry-group-icon {
      font-size: 36px;
    }

    .entry-group-name {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
    }

    .app-header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
    }

    .main-container {
      flex: 1;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    .student-lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 40px;
      text-align: center;
    }

    .student-lock-overlay.hidden {
      display: none !important;
    }

    .lock-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bouncePulse 2s infinite ease-in-out;
    }

    @keyframes bouncePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .tablet-identity-bar {
      background: #1e1b4b;
      border: 2px solid #6366f1;
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .group-id-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .group-id-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .group-id-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.5);
    }

    .group-selector-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .group-label {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
      white-space: nowrap;
    }

    .char-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-pill.active {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
      transform: scale(1.05);
    }

    .matching-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 28px;
      border-radius: 20px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .group-title-tag {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .char-big-badge {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .timer-display-box {
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-clock {
      font-size: 24px;
      font-weight: 900;
      color: #f59e0b;
      font-family: monospace;
    }

    .status-alert-box {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-alert-box.correct {
      background: #064e3b;
      border-color: #10b981;
      color: #34d399;
    }

    .matching-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .matching-board {
        grid-template-columns: 1fr;
      }
    }

    .board-column {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }

    .col-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .item-card.selected {
      border-color: #6366f1;
      background: #312e81;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }

    .item-card.matched {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .match-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
    }

    .item-card.matched .match-badge {
      background: #10b981;
      color: #fff;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- INITIAL GROUP SELECTION MODAL ON ENTRY -->
  <div class="entry-group-modal" id="entry-group-modal">
    <div class="brand-icon" style="font-size: 54px; margin-bottom: 12px;">📱</div>
    <h2 class="entry-title">歡迎來到國語生字配對！</h2>
    <p class="entry-subtitle">📍 請先點選您的小組編號進入房間：</p>
    
    <div class="entry-grid" id="entry-grid-container">
      <!-- Dynamic entry group cards -->
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">📱</span>
      <div>
        <h1 class="brand-title">生字語詞小組配對 - 學生平板端</h1>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="teacher.html" target="_blank" style="color: #a5b4fc; text-decoration: none; font-weight: 700; font-size: 14px; background: #1e1b4b; padding: 6px 14px; border-radius: 8px; border: 1px solid #6366f1;">
        🖥️ 前往教師大螢幕
      </a>
      <div style="font-size: 14px; color: #34d399; font-weight: 700;" id="cloud-status-indicator">
        🟢 雲端同步已連線：等待老師下達指令
      </div>
    </div>
  </header>

  <main class="main-container">
    
    <div class="student-lock-overlay" id="student-lock-overlay">
      <div class="lock-icon" id="lock-overlay-icon">⏳</div>
      <h2 style="font-size: 32px; font-weight: 900; color: #a5b4fc;" id="lock-overlay-title">已進入房間，等待老師按「開始」</h2>
      <p style="font-size: 18px; color: var(--text-muted); margin-top: 12px;" id="lock-overlay-subtitle">
        【第 <span id="overlay-group-id">1</span> 組】已準備就緒，請抬頭觀看黑板大螢幕...
      </p>
    </div>

    <div class="tablet-identity-bar">
      <span style="font-weight: 700; color: #a5b4fc; font-size: 17px;">🏷️ 目前小組：</span>
      <div class="group-id-pills" id="group-id-pills-container">
        <!-- Dynamic group pills -->
      </div>
      <button onclick="showGroupSelectionModal()" style="background: #3730a3; border: 1px solid #818cf8; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px;">
        🔄 重選組別
      </button>
    </div>

    <div class="group-selector-bar">
      <span class="group-label" id="lesson-title-label">📍 本課生字：</span>
      <div class="char-pills" id="char-pills-container">
        <!-- Dynamically populated char pills -->
      </div>
    </div>

    <div class="matching-header">
      <div class="group-title-tag">
        <div class="char-big-badge" id="current-char-badge">裁</div>
        <div>
          <h2 id="current-group-title" style="font-size: 24px; font-weight: 800;">【第 1 組】生字【裁】配對任務</h2>
          <p style="color: var(--text-muted); margin-top: 4px;">老師發布開始後即可作答！連線結果同步至大螢幕。</p>
        </div>
      </div>

      <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
        <div class="timer-display-box">
          <span style="font-size: 14px; color: var(--text-muted); font-weight: 700;">倒數時間</span>
          <span class="timer-clock" id="timer-clock">01:00</span>
        </div>

        <div class="status-alert-box" id="status-indicator">
          <span>⏳ 作答進行中 (0/6)</span>
        </div>
      </div>
    </div>

    <div class="matching-board">
      <div class="board-column">
        <div class="col-title">
          <span>📌 語詞卡片 (點擊選擇)</span>
        </div>
        <div id="words-list" style="display: flex; flex-direction: column; gap: 14px;">

        </div>
      </div>

      <div class="board-column">
        <div class="col-title">
          <span>📖 詞義解釋卡片 (點擊對應)</span>
        </div>
        <div id="defs-list" style="display: flex; flex-direction: column; gap: 14px;">
          <!-- Definitions Cards -->
        </div>
      </div>
    </div>

  </main>

                "items": [
                    { "word": "蔓延", "def": "像蔓草般向四周延展滋生，比喻事物擴散開來。" },
                    { "word": "蔓生", "def": "藤蔓植物攀附他物成長的特性。" },
                    { "word": "枝蔓", "def": "比喻文章或說話中多餘且糾纏不清的分支細節。" },
                    { "word": "蔓草", "def": "蔓延滋生的草，常比喻繁雜或荒蕪的景象。" },
                    { "word": "蔓藤", "def": "細長而能纏繞他物的植物莖。" },
                    { "word": "蔓草荒煙(成語)", "def": "形容荒涼冷落的景象。" }
                ]
            }
        ]
    }
];

    let currentLessonData = defaultLessonBank[0].data;
    let currentLessonId = defaultLessonBank[0].id;
    let totalGroupCount = 7;
    let currentGroupId = null;
    let currentCharIndex = 0;
    let selectedWordCard = null;
    let userMatches = {};
    let shuffledDefs = [];
    let isRoundActive = false;
    let studentTimerInterval = null;

    let presenceInterval = null;
    let mqttClient = null;
    let bcChannel = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();
      renderEntryGroupCards();
      renderGroupPills();
      renderCharPills();
      loadGroupMatching(0);
      initSyncEngine();

      // Check saved group ID
      const savedGId = localStorage.getItem('selected_group_id');
      if (savedGId && !isNaN(parseInt(savedGId))) {
        setGroupId(parseInt(savedGId), false);
      } else {
        showGroupSelectionModal();
      }
    });

    function initSyncEngine() {
      // 1. BroadcastChannel for local tab sync
      try {
        bcChannel = new BroadcastChannel('chinese_vocab_room601');
        bcChannel.onmessage = (event) => {
          handleIncomingSync(event.data);
        };
      } catch(e) {}

      // 2. LocalStorage Storage Listener
      window.addEventListener('storage', (e) => {
        if (e.key === 'vocab_room601_control' && e.newValue) {
          try { applyControlState(JSON.parse(e.newValue)); } catch(err) {}
        }
      });

      // 3. MQTT WebSockets Sync
      if (window.mqtt) {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'student_' + Math.random().toString(16).substr(2, 8),
            keepalive: 30
          });

          mqttClient.on('connect', () => {
            const statusEl = document.getElementById('cloud-status-indicator');
            if (statusEl) statusEl.textContent = '🟢 雲端同步已連線：等待老師下達指令';
            mqttClient.subscribe('chinese_vocab_room601/#');
            reportPresenceToCloud();
            startPresenceHeartbeat();
          });

          mqttClient.on('message', (topic, message) => {
            try {
              const data = JSON.parse(message.toString());
              handleIncomingSync(data);
            } catch(e) {}
          });

          mqttClient.on('error', () => {
            try {
              mqttClient = mqtt.connect('wss://broker.hivemq.com:8000/mqtt', { clientId: 'student_' + Math.random().toString(16).substr(2, 8) });
            } catch(e) {}
          });
        } catch(e) {}
      }

      // 4. Firebase Master Control Listener
      listenToMasterControl();

      // Initial presence trigger if group already set
      if (currentGroupId) {
        reportPresenceToCloud();
        startPresenceHeartbeat();
      }
    }

    function handleIncomingSync(msg) {
      if (!msg) return;
      if (msg.type === 'control') {
        applyControlState(msg.data);
      } else if (msg.type === 'lesson_change') {
        applyLessonChange(msg.data);
      } else if (msg.type === 'character_change') {
        if (msg.data && msg.data.targetCharIndex !== undefined) {
          loadGroupMatching(parseInt(msg.data.targetCharIndex));
        }
      }
    }

    function applyLessonChange(lessonInfo) {
      if (!lessonInfo) return;
      if (lessonInfo.lessonData && Array.isArray(lessonInfo.lessonData)) {
        currentLessonData = lessonInfo.lessonData;
        currentLessonId = lessonInfo.lessonId || currentLessonId;
        currentCharIndex = 0;
        loadGroupMatching(0);
      }
    }

    function applyControlState(ctrl) {
      if (!ctrl) return;
      const overlay = document.getElementById('student-lock-overlay');
      const overlayIcon = document.getElementById('lock-overlay-icon');
      const overlayTitle = document.getElementById('lock-overlay-title');
      const overlaySub = document.getElementById('lock-overlay-subtitle');

      if (ctrl.lessonData && Array.isArray(ctrl.lessonData) && ctrl.lessonData.length > 0) {
        currentLessonData = ctrl.lessonData;
        currentLessonId = ctrl.lessonId || currentLessonId;
      }

      const targetIdx = ctrl.targetCharIndex !== undefined ? parseInt(ctrl.targetCharIndex) : 0;
      if (targetIdx !== currentCharIndex || ctrl.state === 'active') {
        loadGroupMatching(targetIdx);
      }

      const roundTimerSeconds = ctrl.timerSeconds || 60;
      const groupLabelText = currentGroupId ? `【第 ${currentGroupId} 組】` : `【請點選組別】`;

      if (ctrl.state === 'active') {
        if (!currentGroupId) {
          showGroupSelectionModal();
        } else {
          isRoundActive = true;
          overlay.classList.add('hidden');
          startStudentCountdown(ctrl.startTime, roundTimerSeconds);
        }
      } else if (ctrl.state === 'ended') {
        isRoundActive = false;
        if (studentTimerInterval) clearInterval(studentTimerInterval);
        overlay.classList.remove('hidden');
        overlayIcon.textContent = '⏰';
        overlayTitle.textContent = '作答時間到！';
        overlaySub.textContent = `${groupLabelText} 請抬頭觀看黑板大螢幕進行檢討！`;
      } else {
        isRoundActive = false;
        if (studentTimerInterval) clearInterval(studentTimerInterval);
        overlay.classList.remove('hidden');
        overlayIcon.textContent = '⏳';
        overlayTitle.textContent = currentGroupId ? '已進入房間，等待老師按「開始」' : '請先點選您的小組編號！';
        overlaySub.textContent = currentGroupId ? 
          `${groupLabelText} 準備就緒！請看黑板大螢幕等待老師按「開始」...` :
          `請先點選上方組別按鈕，以向老師的大螢幕報到！`;
      }
    }

    function loadSavedSettings() {
      const savedGroups = localStorage.getItem('custom_group_count');
      if (savedGroups) {
        const parsed = parseInt(savedGroups);
        totalGroupCount = (!isNaN(parsed) && parsed > 0) ? parsed : 7;
      } else {
        totalGroupCount = 7;
      }

      const savedLessonData = localStorage.getItem('custom_lesson_data');
      if (savedLessonData) {
        try { currentLessonData = JSON.parse(savedLessonData); } catch(e) {}
      }
    }

    function renderEntryGroupCards() {
      const container = document.getElementById('entry-grid-container');
      if (!container) return;
      let html = '';
      for (let g = 1; g <= totalGroupCount; g++) {
        html += `
          <button type="button" class="entry-group-card" onclick="setGroupId(${g}, true)">
            <span class="entry-group-icon">👥</span>
            <span class="entry-group-name">第 ${g} 組</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function showGroupSelectionModal() {
      const modal = document.getElementById('entry-group-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
      }
    }

    function hideGroupSelectionModal() {
      const modal = document.getElementById('entry-group-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }
    }

    function setGroupId(gId, autoCloseModal = true) {
      currentGroupId = parseInt(gId);
      localStorage.setItem('selected_group_id', currentGroupId);

      if (autoCloseModal) {
        hideGroupSelectionModal();
      }

      renderGroupPills();
      loadGroupMatching(currentCharIndex);

      const overlaySpan = document.getElementById('overlay-group-id');
      if (overlaySpan) overlaySpan.textContent = currentGroupId;

      const overlaySub = document.getElementById('lock-overlay-subtitle');
      if (overlaySub && !isRoundActive) {
        overlaySub.textContent = `【第 ${currentGroupId} 組】已準備就緒，請抬頭觀看黑板大螢幕...`;
      }

      reportPresenceToCloud();
      startPresenceHeartbeat();
    }

    function renderGroupPills() {
      const container = document.getElementById('group-id-pills-container');
      if (!container) return;
      let pillsHtml = '';
      for (let g = 1; g <= totalGroupCount; g++) {
        pillsHtml += `<button class="group-id-btn ${g === currentGroupId ? 'active' : ''}" onclick="setGroupId(${g}, false)">第 ${g} 組</button>`;
      }
      container.innerHTML = pillsHtml;
    }

    function renderCharPills() {
      const container = document.getElementById('char-pills-container');
      if (!container) return;
      container.innerHTML = currentLessonData.map((data, idx) => `
        <button class="char-pill ${idx === currentCharIndex ? 'active' : ''}" onclick="loadGroupMatching(${idx})">
          ${data.char}
        </button>
      `).join('');
    }

    function listenToMasterControl() {
      if (!db) return;
      try {
        db.ref('vocab_rooms/room601/control').on('value', (snapshot) => {
          const ctrl = snapshot.val();
          if (ctrl) applyControlState(ctrl);
        });
      } catch(e) {}
    }

    function reportPresenceToCloud() {
      if (!currentGroupId) return;

      const now = Date.now();
      const payload = { type: 'presence', data: { groupId: currentGroupId, status: 'online', time: now } };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('chinese_vocab_room601/presence', JSON.stringify(payload));
      }
      if (bcChannel) {
        bcChannel.postMessage(payload);
      }
      if (db) {
        try {
          const pRef = db.ref(`vocab_rooms/room601/presence/group_${currentGroupId}`);
          pRef.set({
            groupId: currentGroupId,
            status: 'online',
            updatedAt: now
          });
          pRef.onDisconnect().remove();
        } catch(e) {}
      }

      try {
        const pMap = JSON.parse(localStorage.getItem('vocab_room601_presence') || '{}');
        pMap[currentGroupId] = now;
        localStorage.setItem('vocab_room601_presence', JSON.stringify(pMap));
      } catch(e) {}
    }

    function startPresenceHeartbeat() {
      if (presenceInterval) clearInterval(presenceInterval);
      presenceInterval = setInterval(() => {
        reportPresenceToCloud();
      }, 3000);
    }

    function startStudentCountdown(startTime, totalSecs) {
      if (studentTimerInterval) clearInterval(studentTimerInterval);

      const updateClock = () => {
        const elapsed = Math.floor((Date.now() - (startTime || Date.now())) / 1000);
        const rem = Math.max(0, totalSecs - elapsed);

        const mins = Math.floor(rem / 60);
        const secs = rem % 60;
        const clockEl = document.getElementById('timer-clock');
        if (clockEl) clockEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (rem === 0 && isRoundActive) {
          isRoundActive = false;
          clearInterval(studentTimerInterval);
        }
      };

      updateClock();
      studentTimerInterval = setInterval(updateClock, 1000);
    }

    function loadGroupMatching(index) {
      if (!currentLessonData || !Array.isArray(currentLessonData) || currentLessonData.length === 0) {
        currentLessonData = defaultLessonBank[0].data;
      }

      if (index < 0 || index >= currentLessonData.length) index = 0;
      currentCharIndex = index;

      const groupData = currentLessonData[index];
      if (!groupData) return;

      renderCharPills();

      const charBadge = document.getElementById('current-char-badge');
      if (charBadge) charBadge.textContent = groupData.char;

      const groupTitle = document.getElementById('current-group-title');
      if (groupTitle) groupTitle.textContent = `【第 ${currentGroupId || 1} 組】生字【${groupData.char}】配對任務`;

      selectedWordCard = null;
      userMatches = {};

      const syncKey = `sync_char_${currentCharIndex}`;
      const syncMap = JSON.parse(localStorage.getItem(syncKey) || '{}');
      const gState = syncMap[currentGroupId || 1];

      const items = groupData.items;

      if (gState && gState.userMatches) {
        userMatches = gState.userMatches;
        shuffledDefs = gState.shuffledDefs || [];
      } else {
        shuffledDefs = items.map((item, originalIdx) => ({
          def: item.def,
          originalIdx: originalIdx
        })).sort(() => Math.random() - 0.5);
      }

      document.body.className = '';
      renderMatchingCards();
      updateStatusIndicator();
    }

    function renderMatchingCards() {
      const groupData = currentLessonData[currentCharIndex];
      const wordsContainer = document.getElementById('words-list');
      const defsContainer = document.getElementById('defs-list');
      if (!wordsContainer || !defsContainer || !groupData) return;

      wordsContainer.innerHTML = groupData.items.map((item, wIdx) => {
        const matchedDefIdx = userMatches[wIdx];
        const isMatched = matchedDefIdx !== undefined;
        const isSelected = selectedWordCard === wIdx;

        return `
          <div class="item-card ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''}" onclick="handleWordClick(${wIdx})">
            <span class="word-text">${item.word}</span>
            <div class="match-badge">${isMatched ? '✓' : wIdx + 1}</div>
          </div>
        `;
      }).join('');

      defsContainer.innerHTML = shuffledDefs.map((defObj, dIdx) => {
        let matchedWordIdx = null;
        for (let wIdx in userMatches) {
          if (userMatches[wIdx] === dIdx) {
            matchedWordIdx = parseInt(wIdx);
            break;
          }
        }
        const isMatched = matchedWordIdx !== null;

        return `
          <div class="item-card ${isMatched ? 'matched' : ''}" onclick="handleDefClick(${dIdx})">
            <span class="def-text">${defObj.def}</span>
            <div class="match-badge">${isMatched ? (matchedWordIdx + 1) : String.fromCharCode(65 + dIdx)}</div>
          </div>
        `;
      }).join('');
    }

    function handleWordClick(wIdx) {
      if (!isRoundActive) return;
      selectedWordCard = wIdx;
      renderMatchingCards();
      playBeep(440, 0.05);
    }

    function handleDefClick(dIdx) {
      if (!isRoundActive) return;
      if (selectedWordCard === null) {
        alert("請先點選左側語詞，再點選釋義對應！");
        return;
      }

      userMatches[selectedWordCard] = dIdx;
      selectedWordCard = null;

      renderMatchingCards();
      checkMatchingProgress();
      playBeep(587, 0.08);
    }

    function checkMatchingProgress() {
      const groupData = currentLessonData[currentCharIndex];
      const totalCount = groupData.items.length;
      const matchedCount = Object.keys(userMatches).length;

      const indicator = document.getElementById('status-indicator');

      if (matchedCount < totalCount) {
        indicator.className = 'status-alert-box';
        indicator.innerHTML = `<span>⏳ 作答進行中 (${matchedCount}/${totalCount})</span>`;
        saveSyncState(currentGroupId || 1, currentCharIndex, matchedCount, totalCount, false, userMatches, shuffledDefs);
      } else {
        let correctCount = 0;
        for (let wIdx in userMatches) {
          const dIdx = userMatches[wIdx];
          if (shuffledDefs[dIdx] && shuffledDefs[dIdx].originalIdx === parseInt(wIdx)) {
            correctCount++;
          }
        }

        if (correctCount === totalCount) {
          indicator.className = 'status-alert-box correct';
          indicator.innerHTML = `<span>🎉 【第 ${currentGroupId || 1} 組】100% 全對過關！</span>`;
          document.body.className = 'is-correct-theme';
          triggerConfetti();
          playSuccessSound();
          saveSyncState(currentGroupId || 1, currentCharIndex, totalCount, totalCount, true, userMatches, shuffledDefs);
        } else {
          indicator.className = 'status-alert-box';
          indicator.innerHTML = `<span>⚠️ 答對 ${correctCount}/${totalCount} 題，請再討論調整！</span>`;
          saveSyncState(currentGroupId || 1, currentCharIndex, correctCount, totalCount, false, userMatches, shuffledDefs);
        }
      }
    }

    function updateStatusIndicator() {
      checkMatchingProgress();
    }

    function saveSyncState(gId, cIdx, current, total, isCorrect, matches, defs) {
      const gIdInt = parseInt(gId);
      const payloadData = {
        groupId: gIdInt,
        charIndex: cIdx,
        char: currentLessonData[cIdx] ? currentLessonData[cIdx].char : '',
        current: current,
        total: total,
        isCorrect: isCorrect,
        userMatches: matches,
        shuffledDefs: defs,
        updatedAt: Date.now()
      };

      const syncKey = `sync_char_${cIdx}`;
      const syncMap = JSON.parse(localStorage.getItem(syncKey) || '{}');
      syncMap[gIdInt] = payloadData;
      localStorage.setItem(syncKey, JSON.stringify(syncMap));

      const payloadMsg = { type: 'answer', charIdx: cIdx, data: payloadData };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`chinese_vocab_room601/answers`, JSON.stringify(payloadMsg));
      }
      if (bcChannel) {
        bcChannel.postMessage(payloadMsg);
      }
      if (db) {
        try {
          db.ref(`vocab_rooms/room601/answers/char_${cIdx}/group_${gIdInt}`).set(payloadData);
        } catch(e) {}
      }

      try {
        localStorage.setItem(`vocab_room601_answer_char_${cIdx}_g_${gIdInt}`, JSON.stringify(payloadData));
      } catch(e) {}

      reportPresenceToCloud();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      playBeep(523.25, 0.15);
      setTimeout(() => playBeep(659.25, 0.15), 150);
      setTimeout(() => playBeep(783.99, 0.3), 300);
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          life: 100
        });
      }

      function renderParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.life > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) {
          requestAnimationFrame(renderParticles);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      renderParticles();
    }
  </script>
</body>
</html>
