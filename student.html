<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生字語詞小組配對 - 學生平板端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <!-- Firebase CDN for Real-time Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- MQTT Real-time WebSocket Relay -->
  <script src="lib/mqtt.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.2/dist/mqtt.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.5s ease;
    }

    body.is-correct-theme {
      background-color: #064e3b !important;
    }

    /* INITIAL GROUP SELECTION MODAL */
    .entry-group-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .entry-group-modal.hidden {
      display: none;
    }

    .entry-title {
      font-size: 36px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
    }

    .entry-subtitle {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 32px;
    }

    .entry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      max-width: 700px;
      width: 100%;
    }

    .entry-group-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .entry-group-card:hover {
      border-color: var(--accent);
      transform: scale(1.05);
      background: #2e1065;
    }

    .entry-group-icon {
      font-size: 36px;
    }

    .entry-group-name {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
    }

    .app-header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
    }

    .main-container {
      flex: 1;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    .student-lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 40px;
      text-align: center;
    }

    .student-lock-overlay.hidden {
      display: none;
    }

    .lock-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bouncePulse 2s infinite ease-in-out;
    }

    @keyframes bouncePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .tablet-identity-bar {
      background: #1e1b4b;
      border: 2px solid #6366f1;
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .group-id-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .group-id-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .group-id-btn.active {
      background: #4f46e5;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.5);
    }

    .group-selector-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .group-label {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
      white-space: nowrap;
    }

    .char-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-pill.active {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
      transform: scale(1.05);
    }

    .matching-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 28px;
      border-radius: 20px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
      gap: 16px;
    }

    .group-title-tag {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .char-big-badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
    }

    .timer-display-box {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-clock {
      font-size: 28px;
      font-weight: 900;
      font-family: monospace;
      color: #f59e0b;
    }

    .status-alert-box {
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #334155;
      color: #cbd5e1;
      transition: all 0.3s ease;
    }

    .status-alert-box.correct {
      background: #059669 !important;
      color: #ffffff !important;
      font-size: 22px !important;
      padding: 16px 32px !important;
      box-shadow: 0 0 30px #10b981;
    }

    .matching-board {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .matching-board {
        grid-template-columns: 1fr;
      }
    }

    .board-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .col-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
    }

    .item-card.selected {
      border-color: #a855f7;
      background: #2e1065;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .item-card.matched {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.15);
    }

    .word-text {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
    }

    .def-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .match-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .item-card.matched .match-badge {
      background: var(--success);
      color: #fff;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- INITIAL GROUP SELECTION MODAL ON ENTRY -->
  <div class="entry-group-modal" id="entry-group-modal">
    <div class="brand-icon" style="font-size: 54px; margin-bottom: 12px;">📱</div>
    <h2 class="entry-title">歡迎來到國語生字配對！</h2>
    <p class="entry-subtitle">📍 請先點選您的小組編號進入房間：</p>
    
    <div class="entry-grid" id="entry-grid-container">
      <!-- Generated group cards -->
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">📱</span>
      <div>
        <h1 class="brand-title">生字語詞小組配對 - 學生平板端</h1>
      </div>
    </div>
    <div style="font-size: 14px; color: #34d399; font-weight: 700;" id="cloud-status-indicator">
      🟢 雲端已連線：等待老師下達指令
    </div>
  </header>

  <main class="main-container">
    
    <div class="student-lock-overlay" id="student-lock-overlay">
      <div class="lock-icon" id="lock-overlay-icon">⏳</div>
      <h2 style="font-size: 32px; font-weight: 900; color: #a5b4fc;" id="lock-overlay-title">已進入房間，等待老師按「開始」</h2>
      <p style="font-size: 18px; color: var(--text-muted); margin-top: 12px;" id="lock-overlay-subtitle">
        【第 <span id="overlay-group-id">1</span> 組】已準備就緒，請抬頭觀看黑板大螢幕...
      </p>
    </div>

    <div class="tablet-identity-bar">
      <span style="font-weight: 700; color: #a5b4fc; font-size: 17px;">🏷️ 目前小組：</span>
      <div class="group-id-pills" id="group-id-pills-container">
        <!-- Dynamic group pills -->
      </div>
    </div>

    <div class="group-selector-bar">
      <span class="group-label" id="lesson-title-label">📍 本課生字：</span>
      <div class="char-pills" id="char-pills-container">
        <!-- Dynamically populated char pills -->
      </div>
    </div>

    <div class="matching-header">
      <div class="group-title-tag">
        <div class="char-big-badge" id="current-char-badge">裁</div>
        <div>
          <h2 id="current-group-title" style="font-size: 24px; font-weight: 800;">【第 1 組】生字【裁】配對任務</h2>
          <p style="color: var(--text-muted); margin-top: 4px;">老師發布開始後即可作答！連線結果同步至大螢幕。</p>
        </div>
      </div>

      <div style="display: flex; gap: 16px; align-items: center;">
        <div class="timer-display-box">
          <span style="font-size: 14px; color: var(--text-muted); font-weight: 700;">倒數時間</span>
          <span class="timer-clock" id="timer-clock">01:00</span>
        </div>

        <div class="status-alert-box" id="status-indicator">
          <span>⏳ 作答進行中 (0/6)</span>
        </div>
      </div>
    </div>

    <div class="matching-board">
      <div class="board-column">
        <div class="col-title">
          <span>📌 語詞卡片 (點擊選擇)</span>
        </div>
        <div id="words-list" style="display: flex; flex-direction: column; gap: 14px;">
          <!-- Words Cards -->
        </div>
      </div>

      <div class="board-column">
        <div class="col-title">
          <span>📖 詞義解釋卡片 (點擊對應)</span>
        </div>
        <div id="defs-list" style="display: flex; flex-direction: column; gap: 14px;">
          <!-- Definitions Cards -->
        </div>
      </div>
    </div>

  </main>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chinese-vocab-match-default-rtdb.firebaseio.com"

    try {

    const db = firebase.database ? firebase.database() : null;

        items: [

          { word: "流瀉", def: "月光、水流等流淌、流布的樣子，如「月光流瀉而下」。" },
          { word: "上吐下瀉", def: "又吐又拉，指嚴重的腸胃病症狀。" },
          { word: "一瀉千里(成語)", def: "形容水流速度極快，向下奔流。也比喻文章氣勢奔放，或局勢急劇下滑。" }

      },
      {

        items: [
          { word: "依賴", def: "依靠他人或事物而不能獨立。" },

          { word: "賴帳", def: "不承認欠下的債務。" },
          { word: "賴以為生", def: "依靠某種方式來維持生命或生活。" },
          { word: "誣賴", def: "無中生有地陷害、指責他人。" },
          { word: "百無聊賴(成語)", def: "形容非常無聊，或者生活寂寞潦倒而無所寄託。" }
        ]

    ];

    let currentLessonData = [...defaultLessonData];
    let totalGroupCount = 7;
    let currentGroupId = null; // null initially until student selects!
    let currentCharIndex = 0;
    let selectedWordCard = null;
    let userMatches = {};
    let shuffledDefs = [];

    let presenceInterval = null;
    let mqttClient = null;
    let bcChannel = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();
      renderEntryGroupCards();
      renderGroupPills();
      renderCharPills();
      loadGroupMatching(0);
      initSyncEngine();
    });

    function initSyncEngine() {
      // 1. BroadcastChannel for local tab sync
      try {
        bcChannel = new BroadcastChannel('chinese_vocab_room601');
        bcChannel.onmessage = (event) => {
          handleIncomingSync(event.data);
        };
      } catch(e) {}

      // 2. MQTT for Cloud Real-time WebSockets Sync
      if (window.mqtt) {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'student_' + Math.random().toString(16).substr(2, 8),
            keepalive: 30
          });

          mqttClient.on('connect', () => {
            const statusEl = document.getElementById('cloud-status-indicator');
            if (statusEl) statusEl.textContent = '🟢 雲端同步已連線：等待老師下達指令';
            mqttClient.subscribe('chinese_vocab_room601/#');
            reportPresenceToCloud();
          });

          mqttClient.on('message', (topic, message) => {
            try {
              const data = JSON.parse(message.toString());
              handleIncomingSync(data);
            } catch(e) {}
          });

          mqttClient.on('error', () => {
            // Fallback to HiveMQ
            try {
              mqttClient = mqtt.connect('wss://broker.hivemq.com:8000/mqtt', { clientId: 'student_' + Math.random().toString(16).substr(2, 8) });
            } catch(e) {}
          });
        } catch(e) {}
      }

      // 3. Firebase Fallback
      listenToMasterControl();
    }

    function handleIncomingSync(msg) {
      if (!msg) return;
      if (msg.type === 'control') {
        applyControlState(msg.data);
      }
    }

    function applyControlState(ctrl) {
      if (!ctrl) return;
      const overlay = document.getElementById('student-lock-overlay');
      const overlayIcon = document.getElementById('lock-overlay-icon');
      const overlayTitle = document.getElementById('lock-overlay-title');
      const overlaySub = document.getElementById('lock-overlay-subtitle');

      if (ctrl.targetCharIndex !== undefined && ctrl.targetCharIndex !== currentCharIndex) {
        loadGroupMatching(ctrl.targetCharIndex);
      }

      roundTimerSeconds = ctrl.timerSeconds || 60;
      const groupLabelText = currentGroupId ? `【第 ${currentGroupId} 組】` : `【請點選組別】`;

      if (ctrl.state === 'active') {
        if (!currentGroupId) {
          document.getElementById('entry-group-modal').classList.remove('hidden');
        } else {
          isRoundActive = true;
          overlay.classList.add('hidden');
          startStudentCountdown(ctrl.startTime, ctrl.timerSeconds);
        }
      } else if (ctrl.state === 'ended') {
        isRoundActive = false;
        if (studentTimerInterval) clearInterval(studentTimerInterval);
        overlay.classList.remove('hidden');
        overlayIcon.textContent = '⏰';
        overlayTitle.textContent = '作答時間到！';
        overlaySub.textContent = `${groupLabelText} 請抬頭觀看黑板大螢幕進行檢討！`;
      } else {
        isRoundActive = false;
        if (studentTimerInterval) clearInterval(studentTimerInterval);
        overlay.classList.remove('hidden');
        overlayIcon.textContent = '⏳';
        overlayTitle.textContent = currentGroupId ? '已進入房間，等待老師按「開始」' : '請先點選您的小組編號！';
        overlaySub.textContent = currentGroupId ? 
          `${groupLabelText} 準備就緒！請看黑板大螢幕等待老師按「開始」...` :
          `請先點選上方組別按鈕，以向老師的大螢幕報到！`;
      }
    }

    function loadSavedSettings() {
      const savedGroups = localStorage.getItem('custom_group_count');
      if (savedGroups) totalGroupCount = parseInt(savedGroups);

      const savedLessonData = localStorage.getItem('custom_lesson_data');
      if (savedLessonData) {
        try { currentLessonData = JSON.parse(savedLessonData); } catch(e) {}
      }

      currentGroupId = null;
      document.getElementById('entry-group-modal').classList.remove('hidden');
    }

    function renderEntryGroupCards() {
      const container = document.getElementById('entry-grid-container');
      let html = '';
      for (let g = 1; g <= totalGroupCount; g++) {
        html += `
          <div class="entry-group-card" onclick="selectInitialGroup(${g})">
            <span class="entry-group-icon">👥</span>
            <span class="entry-group-name">第 ${g} 組</span>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function showGroupSelectionModal() {
      document.getElementById('entry-group-modal').classList.remove('hidden');
    }

    function selectInitialGroup(gId) {
      currentGroupId = gId;
      localStorage.setItem('selected_group_id', gId);
      document.getElementById('entry-group-modal').classList.add('hidden');
      renderGroupPills();
      loadGroupMatching(currentCharIndex);
      reportPresenceToCloud();
      startPresenceHeartbeat();
    }

    function renderGroupPills() {
      const container = document.getElementById('group-id-pills-container');
      let pillsHtml = '';
      for (let g = 1; g <= totalGroupCount; g++) {
        pillsHtml += `<button class="group-id-btn ${g === currentGroupId ? 'active' : ''}" onclick="setGroupId(${g})">第 ${g} 組</button>`;
      }
      container.innerHTML = pillsHtml;
      const overlaySpan = document.getElementById('overlay-group-id');
      if (overlaySpan) {
        overlaySpan.textContent = currentGroupId ? currentGroupId : '未選擇';
      }
    }

    function setGroupId(gId) {
      currentGroupId = gId;
      localStorage.setItem('selected_group_id', gId);
      renderGroupPills();
      loadGroupMatching(currentCharIndex);
      reportPresenceToCloud();
      startPresenceHeartbeat();
    }

    function renderCharPills() {
      const container = document.getElementById('char-pills-container');
      container.innerHTML = currentLessonData.map((data, idx) => `
        <button class="char-pill ${idx === currentCharIndex ? 'active' : ''}" onclick="loadGroupMatching(${idx})">
          ${data.char}
        </button>
      `).join('');
    }

    function listenToMasterControl() {
      if (!db) return;

      db.ref('vocab_rooms/room601/control').on('value', (snapshot) => {
        const ctrl = snapshot.val();
        if (ctrl) applyControlState(ctrl);
      });
    }

    function reportPresenceToCloud() {
      if (!currentGroupId) return;

      const payload = { type: 'presence', data: { groupId: currentGroupId, status: 'online', time: Date.now() } };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('chinese_vocab_room601/presence', JSON.stringify(payload));
      }
      if (bcChannel) {
        bcChannel.postMessage(payload);
      }
      if (db) {
        try {
          const pRef = db.ref(`vocab_rooms/room601/presence/group_${currentGroupId}`);
          pRef.set({
            groupId: currentGroupId,
            status: 'online',
            updatedAt: Date.now()
          });
          pRef.onDisconnect().remove();
        } catch(e) {}
      }
    }

    function startPresenceHeartbeat() {
      if (presenceInterval) clearInterval(presenceInterval);
      presenceInterval = setInterval(() => {
        reportPresenceToCloud();
      }, 3000);
    }

    function startStudentCountdown(startTime, totalSecs) {
      if (studentTimerInterval) clearInterval(studentTimerInterval);

      const updateClock = () => {
        const elapsed = Math.floor((new Date().getTime() - (startTime || new Date().getTime())) / 1000);
        const rem = Math.max(0, totalSecs - elapsed);

        const mins = Math.floor(rem / 60);
        const secs = rem % 60;
        document.getElementById('timer-clock').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (rem === 0 && isRoundActive) {
          isRoundActive = false;
          clearInterval(studentTimerInterval);
        }
      };

      updateClock();
      studentTimerInterval = setInterval(updateClock, 1000);
    }

    function loadGroupMatching(index) {
      if (index >= currentLessonData.length) index = 0;
      currentCharIndex = index;
      renderCharPills();

      const groupData = currentLessonData[index];
      document.getElementById('current-char-badge').textContent = groupData.char;
      document.getElementById('current-group-title').textContent = `【第 ${currentGroupId || 1} 組】生字【${groupData.char}】配對任務`;

      selectedWordCard = null;
      userMatches = {};

      const syncKey = `sync_char_${currentCharIndex}`;
      const syncMap = JSON.parse(localStorage.getItem(syncKey) || '{}');
      const gState = syncMap[currentGroupId || 1];

      const items = groupData.items;

      if (gState && gState.userMatches) {
        userMatches = gState.userMatches;
        shuffledDefs = gState.shuffledDefs || [];
      } else {
        shuffledDefs = items.map((item, originalIdx) => ({
          def: item.def,
          originalIdx: originalIdx
        })).sort(() => Math.random() - 0.5);
      }

      document.body.className = '';
      renderMatchingCards();
      updateStatusIndicator();
    }

    function renderMatchingCards() {
      const groupData = currentLessonData[currentCharIndex];
      const wordsContainer = document.getElementById('words-list');
      const defsContainer = document.getElementById('defs-list');

      wordsContainer.innerHTML = groupData.items.map((item, wIdx) => {
        const matchedDefIdx = userMatches[wIdx];
        const isMatched = matchedDefIdx !== undefined;
        const isSelected = selectedWordCard === wIdx;

        return `
          <div class="item-card ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''}" onclick="handleWordClick(${wIdx})">
            <span class="word-text">${item.word}</span>
            <div class="match-badge">${isMatched ? '✓' : wIdx + 1}</div>
          </div>
        `;
      }).join('');

      defsContainer.innerHTML = shuffledDefs.map((defObj, dIdx) => {
        let matchedWordIdx = null;
        for (let wIdx in userMatches) {
          if (userMatches[wIdx] === dIdx) {
            matchedWordIdx = parseInt(wIdx);
            break;
          }
        }
        const isMatched = matchedWordIdx !== null;

        return `
          <div class="item-card ${isMatched ? 'matched' : ''}" onclick="handleDefClick(${dIdx})">
            <span class="def-text">${defObj.def}</span>
            <div class="match-badge">${isMatched ? (matchedWordIdx + 1) : String.fromCharCode(65 + dIdx)}</div>
          </div>
        `;
      }).join('');
    }

    function handleWordClick(wIdx) {
      if (!isRoundActive) return;
      selectedWordCard = wIdx;
      renderMatchingCards();
      playBeep(440, 0.05);
    }

    function handleDefClick(dIdx) {
      if (!isRoundActive) return;
      if (selectedWordCard === null) {
        alert("請先點選左側語詞，再點選釋義對應！");
        return;
      }

      userMatches[selectedWordCard] = dIdx;
      selectedWordCard = null;

      renderMatchingCards();
      checkMatchingProgress();
      playBeep(587, 0.08);
    }

    function checkMatchingProgress() {
      const groupData = currentLessonData[currentCharIndex];
      const totalCount = groupData.items.length;
      const matchedCount = Object.keys(userMatches).length;

      const indicator = document.getElementById('status-indicator');

      if (matchedCount < totalCount) {
        indicator.className = 'status-alert-box';
        indicator.innerHTML = `<span>⏳ 作答進行中 (${matchedCount}/${totalCount})</span>`;
        saveSyncState(currentGroupId || 1, currentCharIndex, matchedCount, totalCount, false, userMatches, shuffledDefs);
      } else {
        let correctCount = 0;
        for (let wIdx in userMatches) {
          const dIdx = userMatches[wIdx];
          if (shuffledDefs[dIdx].originalIdx === parseInt(wIdx)) {
            correctCount++;
          }
        }

        if (correctCount === totalCount) {
          indicator.className = 'status-alert-box correct';
          indicator.innerHTML = `<span>🎉 【第 ${currentGroupId || 1} 組】100% 全對過關！</span>`;
          document.body.className = 'is-correct-theme';
          triggerConfetti();
          playSuccessSound();
          saveSyncState(currentGroupId || 1, currentCharIndex, totalCount, totalCount, true, userMatches, shuffledDefs);
        } else {
          indicator.className = 'status-alert-box';
          indicator.innerHTML = `<span>⚠️ 答對 ${correctCount}/${totalCount} 題，請再討論調整！</span>`;
          saveSyncState(currentGroupId || 1, currentCharIndex, correctCount, totalCount, false, userMatches, shuffledDefs);
        }
      }
    }

    function updateStatusIndicator() {
      checkMatchingProgress();
    }

    function saveSyncState(gId, cIdx, current, total, isCorrect, matches, defs) {
      const syncKey = `sync_char_${cIdx}`;
      const syncMap = JSON.parse(localStorage.getItem(syncKey) || '{}');

      const payloadData = {
        groupId: gId,
        char: currentLessonData[cIdx].char,
        current: current,
        total: total,
        isCorrect: isCorrect,
        userMatches: matches,
        shuffledDefs: defs,
        updatedAt: new Date().getTime()
      };

      syncMap[gId] = payloadData;
      localStorage.setItem(syncKey, JSON.stringify(syncMap));

      const payloadMsg = { type: 'answer', charIdx: cIdx, data: payloadData };

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`chinese_vocab_room601/answer/${cIdx}`, JSON.stringify(payloadMsg));
      }
      if (bcChannel) {
        bcChannel.postMessage(payloadMsg);
      }
      if (db) {
        try {
          db.ref(`vocab_rooms/room601/char_${cIdx}/group_${gId}`).set(payloadData);
        } catch(e) {}
      }
      reportPresenceToCloud();
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      playBeep(523.25, 0.15);
      setTimeout(() => playBeep(659.25, 0.15), 150);
      setTimeout(() => playBeep(783.99, 0.3), 300);
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          life: 100
        });
      }

      function renderParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.life > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) {
          requestAnimationFrame(renderParticles);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      renderParticles();
    }
  </script>
